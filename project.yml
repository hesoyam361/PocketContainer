name: PocketContainer
options:
bundleIdPrefix: com.pocketcontainer
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.example.PocketContainer
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: PocketContainer
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  PocketContainer:
    type: application
    platform: iOS
    sources:
      - Sources/PocketContainer
    settings:
      base:
        PRODUCT_NAME: PocketContainer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
