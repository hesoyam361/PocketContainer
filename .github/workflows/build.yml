
name: Build PocketContainer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          ls -la
          test -f project.yml
          test -f PocketContainerApp.swift || test -f Sources/PocketContainer/PocketContainerApp.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project PocketContainer.xcodeproj \
            -scheme PocketContainer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload app build
        uses: actions/upload-artifact@v4
        with:
          name: PocketContainer-build
          path: build/Build/Products/Release-iphoneos/
          if-no-files-found: error
