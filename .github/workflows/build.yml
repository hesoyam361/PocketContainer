
name: Build PocketContainer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking PocketContainer files"
          ls -la
          test -f project.yml
          test -f PocketContainerApp.swift

      - name: Build project
        run: |
          echo "Project files found. A full Xcode project is required for an IPA build."

